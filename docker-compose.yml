# Production-ready self-hosted n8n
# n8n + PostgreSQL + Caddy (automatic HTTPS) + nightly database backups
#
# Usage:
#   cp .env.example .env   # then fill in the values
#   docker compose up -d

name: n8n-stack

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public URL (behind Caddy)
      N8N_HOST: ${N8N_DOMAIN:?Set N8N_DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-https://${N8N_DOMAIN}/}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-https://${N8N_DOMAIN}/}
      N8N_PROXY_HOPS: 1
      # Security
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Housekeeping
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Brussels}
      TZ: ${TIMEZONE:-Europe/Brussels}
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_MAX_AGE_HOURS:-336}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/files
    # Explicit upstream DNS, so workflows can reach the internet even when the
    # host resolver is a VPN (NetBird/Tailscale) that refuses public lookups.
    dns:
      - ${DNS_PRIMARY:-1.1.1.1}
      - ${DNS_SECONDARY:-9.9.9.9}
    networks:
      - backend
      - frontend
    # No ports published: n8n is only reachable through Caddy.

  caddy:
    image: caddy:${CADDY_VERSION:-2}-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    dns:
      - ${DNS_PRIMARY:-1.1.1.1}
      - ${DNS_SECONDARY:-9.9.9.9}
    networks:
      - frontend

  backup:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-n8n}
      PGUSER: ${POSTGRES_USER:-n8n}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TIMEZONE:-Europe/Brussels}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$${BACKUP_CRON} /bin/sh /usr/local/bin/backup.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "Backup scheduled: $${BACKUP_CRON} (keep $${BACKUP_KEEP_DAYS} days)"
        exec crond -f -l 8
    networks:
      - backend

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend:
